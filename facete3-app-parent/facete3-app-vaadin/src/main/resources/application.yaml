# Improve startup time by restricting package scan to only selected packages

# Note: The leaflet plugin needs explicit whitelisting of software/xdev/vaadin:
#       https://github.com/xdev-software/vaadin-maps-leaflet-flow/issues/137

vaadin:
  allowed-packages: com/vaadin/addon/leaflet4vaadin,org/aksw/facete3/app/vaadin,software/xdev/vaadin
  compatibilityMode: false
  launch-browser: true

server:
  port: 8000

logging:
  level: debug
  level.org.atmosphere: warn

# https://www.orkg.org/orkg/sparql/
# https://www.orkg.org/orkg/triplestore/
# http://cord19.aksw.org/sparql
# https://databus.dbpedia.org/repo/sparql
#facete3.sparqlEndpoint = http://cord19.aksw.org/sparql
##facete3.sparqlEndpoint = http://moin.aksw.org/sparql
##facete3.nli.endpoint = http://cord19.aksw.org/nli
facete3:
  nli:
    resultLimit: 100
  #facete3.alternativeLabel = http://id.loc.gov/ontologies/bibframe/title
  prefixSources:
    - rdf-prefixes/prefix.cc.2019-12-17.ttl
    - prefixes.ttl
  #facete3.linkProperty = http://id.loc.gov/ontologies/bibframe/identifiedBy

spring:
  cloud:
    refresh:
      enabled: true
